services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:55439:5432"
    environment:
      POSTGRES_USER: soundlab_admin
      POSTGRES_PASSWORD: soundlab-local-only
    volumes:
      - soundlab_db:/var/lib/postgresql/data
      - ./config/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundlab_admin"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  soundlab_db:
